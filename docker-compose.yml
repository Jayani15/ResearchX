services:
  postgres:
    image: postgres:16
    container_name: researchx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: researchx
      POSTGRES_USER: researchx
      POSTGRES_PASSWORD: researchx_dev_password
    ports:
      - "5432:5432"
    volumes:
      - researchx_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U researchx -d researchx"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  researchx_postgres_data:
